openapi: 3.0.2
info:
  title: SQL Analytics Agent V3
  description: SkySecure v3 Compliant Teams Bot + OpenAPI Backend
  version: 0.1.0
paths:
  /api/tools/database/schema:
    post:
      tags:
      - Database Tools
      summary: Get Database Schema
      description: Returns the database schema (tables and their columns) so the AI
        knows what to query.
      operationId: get_database_schema_api_tools_database_schema_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaData'
  /api/tools/database/query:
    post:
      tags:
      - Database Tools
      summary: Execute Sql Query
      description: 'Executes a SQL query securely and returns the rows.

        In a real production environment, this should enforce READ-ONLY connections.'
      operationId: execute_sql_query_api_tools_database_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryData'
components:
  schemas:
    InteractionRequest:
      properties:
        account_name:
          type: string
          title: Account Name
        type:
          type: string
          title: Type
      type: object
      title: InteractionRequest
    PipelineRequest:
      properties:
        period:
          type: string
          title: Period
        region:
          type: string
          title: Region
        industry:
          type: string
          title: Industry
      type: object
      title: PipelineRequest
    QueryData:
      properties:
        columns:
          items:
            type: string
          type: array
          title: Columns
          description: List of column names returned.
        rows:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Rows
          description: List of rows returned as key-value dictionaries.
      type: object
      title: QueryData
    QueryRequest:
      properties:
        query:
          type: string
          title: Query
          description: The SQL query to execute against the CRM database.
      type: object
      required:
      - query
      title: QueryRequest
    SchemaData:
      properties:
        schema_info:
          type: string
          title: Schema Info
          description: Text representation of the database schema (tables and columns).
          default: ''
      type: object
      title: SchemaData
    TopAccountsRequest:
      properties:
        limit:
          type: integer
          title: Limit
          default: 5
        industry:
          type: string
          title: Industry
        region:
          type: string
          title: Region
      type: object
      title: TopAccountsRequest
servers:
- url: https://api.example.com
  description: Local development server via dev tunnel or ngrok
